services:
  - type: web
    name: queryopt-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DATABASE_URL
        fromDatabase:
          name: queryopt-db
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,https://queryopt-ai.lovable.app
      - key: SUPABASE_FUNCTION_URL
        value: https://bnupdkmupptzmowblmtm.supabase.co/functions/v1/queryopt-api
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_tl-uCrK3w7LQSmaqANICiQ_zmCAjsQk

databases:
  - name: queryopt-db
    databaseName: queryopt
    user: queryopt
    plan: free
    region: singapore
    postgresMajorVersion: "16"

